services:
  nginx-general:
    image: nginx:stable-bookworm-perl
    restart: always
    ports:
      - 443:443
    networks:
      - koeg-dev
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - koeg-dev-ssl:/ssl
    depends_on:
      - nginx-mc
      - nginx-pc
  nginx-mc:
    image: nginx:stable-bookworm-perl
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx-mc.conf:ro
    network_mode: "host"
  nginx-pc:
    image: nginx:stable-bookworm-perl
    restart: always
    volumes:
      - ./nginx-pc.conf:/etc/nginx/nginx-pc.conf:ro
    depends_on:
      - wol-script
    network_mode: "host"
  wol-script:
    build: ./wol-script
    restart: always
    ports:
      - 5000:5000  
networks:
  koeg-dev:
    external: true
volumes:
  koeg-dev-ssl:
    external: true
