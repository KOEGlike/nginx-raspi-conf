events {
}

stream { 
    # Map the hostname to allow RDP only for pc.koeg.dev
    map $ssl_preread_server_name $rdp_allowed {
        pc.koeg.dev 1;
        default 0;
    }

    # Forward RDP traffic (port 3389) only if the hostname matches pc.koeg.dev
    server {
        listen 3389;
        proxy_pass 192.168.5.213:3389;
        ssl_preread on;

        # Deny access if the hostname is not pc.koeg.dev
        if ($rdp_allowed = 0) {
            return 403;
        }
    }
}

http {
    server {
        listen 443;
        server_name pc.koeg.dev;

        location /start {
            # Forward /start requests to the Flask app running on localhost:5000
            proxy_pass wol-script:5000/start;

            # Optional: Add headers for better proxy handling
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}